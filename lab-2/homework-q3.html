<!DOCTYPE html>
<html>
<head>
  <title>Sliding Text on Image</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    #imgBox {
      width: 500px;
      position: relative;
      overflow: hidden;
    }
    #imgBox img {
      width: 100%;
      display: block;
    }
    #slideText {
      position: absolute;
      top: 20px;
      left: -100%;
      width: 100%;
      color: white;
      background: rgba(0,0,0,0.6);
      padding: 10px;
      box-sizing: border-box;
      font-size: 20px;
    }
  </style>
</head>
<body>

  <h2>Sliding Text on Image</h2>

  <div id="imgBox">
    <img src="https://picsum.photos/800/400" alt="Image">
    <div id="slideText">Sliding Text Here!</div>
  </div>

  <br>
  <button id="slideBtn">Slide Text</button>

  <script>
    $(document).ready(function () {
      $("#slideBtn").click(function () {
        $("#slideText")
          .stop(true)
          .css("left", "-100%")
          .animate({ left: "0%" }, 800)
          .delay(1000)
          .animate({ left: "100%" }, 800);
      });
    });
  </script>

</body>
</html>
