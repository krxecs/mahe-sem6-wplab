<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employee CRUD Operations</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background: #6c757d;
      min-height: 100vh;
      padding: 20px 0;
    }
    
    .container {
      background: white;
      border-radius: 15px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 30px;
      margin-top: 20px;
    }
    
    .header {
      text-align: center;
      margin-bottom: 30px;
      color: #667eea;
    }
    
    .header h1 {
      font-weight: bold;
      margin-bottom: 10px;
    }
    
    .form-section {
      background: #f8f9fa;
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 30px;
    }
    
    .form-section h3 {
      color: #667eea;
      margin-bottom: 20px;
    }
    
    .btn-custom {
      background: #0d6efd;
      border: none;
      color: white;
      padding: 10px 25px;
      border-radius: 5px;
      font-weight: bold;
      transition: transform 0.2s;
    }
    
    .btn-custom:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(13, 110, 253, 0.4);
    }
    
    .table-section {
      overflow-x: auto;
    }
    
    table {
      border-radius: 10px;
      overflow: hidden;
    }
    
    thead {
      background: #0d6efd;
      color: white;
    }
    
    .action-btn {
      margin: 0 5px;
      padding: 5px 12px;
      border-radius: 5px;
      border: none;
      color: white;
      cursor: pointer;
      transition: transform 0.2s;
    }
    
    .action-btn:hover {
      transform: scale(1.1);
    }
    
    .edit-btn {
      background-color: #ffc107;
    }
    
    .delete-btn {
      background-color: #dc3545;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #6c757d;
    }
    
    .badge-custom {
      padding: 8px 15px;
      border-radius: 20px;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Employee Management System</h1>
      <p class="text-muted">Database-Oriented CRUD Operations</p>
    </div>
    
    <!-- Form Section -->
    <div class="form-section">
      <h3><span id="formTitle">Add New Employee</span></h3>
      <form id="employeeForm">
        <input type="hidden" id="employeeId">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="empName" class="form-label">Employee Name *</label>
            <input type="text" class="form-control" id="empName" placeholder="Enter full name" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="empEmail" class="form-label">Email Address *</label>
            <input type="email" class="form-control" id="empEmail" placeholder="Enter email" required>
          </div>
        </div>
        <div class="row">
          <div class="col-md-4 mb-3">
            <label for="empPhone" class="form-label">Phone Number *</label>
            <input type="tel" class="form-control" id="empPhone" placeholder="Enter phone" required>
          </div>
          <div class="col-md-4 mb-3">
            <label for="empDepartment" class="form-label">Department *</label>
            <select class="form-control" id="empDepartment" required>
              <option value="">Select Department</option>
              <option value="IT">IT</option>
              <option value="HR">HR</option>
              <option value="Finance">Finance</option>
              <option value="Marketing">Marketing</option>
              <option value="Operations">Operations</option>
              <option value="Sales">Sales</option>
            </select>
          </div>
          <div class="col-md-4 mb-3">
            <label for="empSalary" class="form-label">Salary *</label>
            <input type="number" class="form-control" id="empSalary" placeholder="Enter salary" required>
          </div>
        </div>
        <div class="row">
          <div class="col-md-6 mb-3">
            <label for="empPosition" class="form-label">Position *</label>
            <input type="text" class="form-control" id="empPosition" placeholder="Enter position" required>
          </div>
          <div class="col-md-6 mb-3">
            <label for="empJoinDate" class="form-label">Joining Date *</label>
            <input type="date" class="form-control" id="empJoinDate" required>
          </div>
        </div>
        <div class="text-center mt-3">
          <button type="submit" class="btn btn-custom me-2">
            <span id="submitBtnText">Add Employee</span>
          </button>
          <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;">
            Cancel
          </button>
        </div>
      </form>
    </div>
    
    <!-- Table Section -->
    <div class="table-section">
      <h3 class="mb-3">Employee Records</h3>
      <div class="mb-3">
        <input type="text" class="form-control" id="searchInput" placeholder="Search employees by name, email, department...">
      </div>
      <div id="tableContainer">
        <table class="table table-hover table-striped">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>Department</th>
              <th>Position</th>
              <th>Salary</th>
              <th>Join Date</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="employeeTableBody">
            <tr>
              <td colspan="9" class="empty-state">
                <p>No employees found. Add your first employee to get started!</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <div class="text-center mt-4">
      <p class="text-muted">
        Data is temporary and will be lost on page refresh
      </p>
    </div>
  </div>

  <!-- jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  
  <script>
    $(document).ready(function() {
      let employees = [];
      let editingId = null;
      
      // Generate unique ID
      function generateId() {
        return employees.length > 0 ? Math.max(...employees.map(e => e.id)) + 1 : 1;
      }
      
      // CREATE - Add new employee
      $('#employeeForm').on('submit', function(e) {
        e.preventDefault();
        
        const employee = {
          id: editingId || generateId(),
          name: $('#empName').val(),
          email: $('#empEmail').val(),
          phone: $('#empPhone').val(),
          department: $('#empDepartment').val(),
          position: $('#empPosition').val(),
          salary: $('#empSalary').val(),
          joinDate: $('#empJoinDate').val()
        };
        
        if (editingId) {
          // UPDATE
          const index = employees.findIndex(e => e.id === editingId);
          employees[index] = employee;
          editingId = null;
          resetForm();
          showAlert('Employee updated successfully!', 'success');
        } else {
          // CREATE
          employees.push(employee);
          showAlert('Employee added successfully!', 'success');
        }
        
        displayEmployees();
        $('#employeeForm')[0].reset();
      });
      
      // READ - Display all employees
      function displayEmployees(filteredEmployees = null) {
        const displayList = filteredEmployees || employees;
        const tbody = $('#employeeTableBody');
        tbody.empty();
        
        if (displayList.length === 0) {
          tbody.html(`
            <tr>
              <td colspan="9" class="empty-state">
                <p>No employees found.</p>
              </td>
            </tr>
          `);
          return;
        }
        
        displayList.forEach(emp => {
          const row = `
            <tr>
              <td>${emp.id}</td>
              <td><strong>${emp.name}</strong></td>
              <td>${emp.email}</td>
              <td>${emp.phone}</td>
              <td><span class="badge bg-info badge-custom">${emp.department}</span></td>
              <td>${emp.position}</td>
              <td>$${parseFloat(emp.salary).toLocaleString()}</td>
              <td>${new Date(emp.joinDate).toLocaleDateString()}</td>
              <td>
                <button class="action-btn edit-btn" onclick="editEmployee(${emp.id})">
                  Edit
                </button>
                <button class="action-btn delete-btn" onclick="deleteEmployee(${emp.id})">
                  Delete
                </button>
              </td>
            </tr>
          `;
          tbody.append(row);
        });
      }
      
      // UPDATE - Edit employee
      window.editEmployee = function(id) {
        const employee = employees.find(e => e.id === id);
        if (employee) {
          editingId = id;
          $('#employeeId').val(employee.id);
          $('#empName').val(employee.name);
          $('#empEmail').val(employee.email);
          $('#empPhone').val(employee.phone);
          $('#empDepartment').val(employee.department);
          $('#empPosition').val(employee.position);
          $('#empSalary').val(employee.salary);
          $('#empJoinDate').val(employee.joinDate);
          
          $('#formTitle').text('Update Employee');
          $('#submitBtnText').text('Update Employee');
          $('#cancelBtn').show();
          
          $('html, body').animate({
            scrollTop: $('.form-section').offset().top - 20
          }, 500);
        }
      };
      
      // DELETE - Remove employee
      window.deleteEmployee = function(id) {
        if (confirm('Are you sure you want to delete this employee?')) {
          employees = employees.filter(e => e.id !== id);
          displayEmployees();
          showAlert('Employee deleted successfully!', 'danger');
        }
      };
      
      // Cancel editing
      $('#cancelBtn').on('click', function() {
        resetForm();
      });
      
      // Reset form
      function resetForm() {
        editingId = null;
        $('#employeeForm')[0].reset();
        $('#formTitle').text('Add New Employee');
        $('#submitBtnText').text('Add Employee');
        $('#cancelBtn').hide();
      }
      
      // Search functionality
      $('#searchInput').on('keyup', function() {
        const searchTerm = $(this).val().toLowerCase();
        const filtered = employees.filter(emp => 
          emp.name.toLowerCase().includes(searchTerm) ||
          emp.email.toLowerCase().includes(searchTerm) ||
          emp.department.toLowerCase().includes(searchTerm) ||
          emp.position.toLowerCase().includes(searchTerm) ||
          emp.phone.includes(searchTerm)
        );
        displayEmployees(filtered);
      });
      
      // Show alert messages
      function showAlert(message, type) {
        const alertHtml = `
          <div class="alert alert-${type} alert-dismissible fade show" role="alert" style="position: fixed; top: 20px; right: 20px; z-index: 9999; min-width: 300px;">
            ${message}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        `;
        $('body').append(alertHtml);
        setTimeout(() => {
          $('.alert').fadeOut('slow', function() { $(this).remove(); });
        }, 3000);
      }
      
      // Initialize
      displayEmployees();
    });
  </script>
</body>
</html>
