<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Train Ticket Booking</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f0f2f5;
      padding: 20px 0;
      font-family: 'Segoe UI', system-ui, Tahoma, Geneva, Verdana, sans-serif;
    }

    .booking-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .booking-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      padding: 40px;
      margin-bottom: 20px;
    }

    .header-section {
      text-align: center;
      margin-bottom: 35px;
      padding-bottom: 20px;
      border-bottom: 3px solid #0d6efd;
    }

    .header-section h1 {
      color: #0d6efd;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .header-section p {
      color: #6c757d;
      font-size: 1.1rem;
    }

    .form-label {
      font-weight: 600;
      color: #495057;
      margin-bottom: 8px;
    }

    .form-control, .form-select {
      border: 2px solid #e9ecef;
      border-radius: 8px;
      padding: 10px 15px;
      transition: all 0.3s ease;
    }

    .form-control:focus, .form-select:focus {
      border-color: #0d6efd;
      box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.15);
    }

    .section-title {
      font-size: 1.3rem;
      font-weight: 600;
      color: #212529;
      margin-top: 25px;
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid #e9ecef;
    }

    .radio-group {
      padding: 15px;
      background-color: #f8f9fa;
      border-radius: 8px;
    }

    .form-check-label {
      font-weight: 500;
      margin-left: 5px;
    }

    .form-check-input:checked {
      background-color: #0d6efd;
      border-color: #0d6efd;
    }

    .btn-book {
      background-color: #0d6efd;
      border: none;
      padding: 12px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-book:hover {
      background-color: #0b5ed7;
      transform: translateY(-2px);
      box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
    }

    .btn-reset {
      background-color: #6c757d;
      border: none;
      padding: 12px 40px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .btn-reset:hover {
      background-color: #5c636a;
      transform: translateY(-2px);
    }

    .alert-custom {
      border-radius: 8px;
      display: none;
    }

    .journey-info {
      background-color: #e7f3ff;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid #0d6efd;
    }

    .passenger-badge {
      display: inline-block;
      padding: 5px 15px;
      background-color: #0d6efd;
      color: white;
      border-radius: 20px;
      font-size: 0.9rem;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <div class="container booking-container">
    <div class="booking-card">
      <div class="header-section">
        <h1>Train Ticket Booking</h1>
        <p>Book your journey with comfort and convenience</p>
      </div>

      <!-- Alert Messages -->
      <div id="successAlert" class="alert alert-success alert-custom" role="alert">
        <h5 class="alert-heading">Booking Successful!</h5>
        <p id="bookingDetails"></p>
      </div>

      <div id="errorAlert" class="alert alert-danger alert-custom" role="alert">
        <strong>Error!</strong> Please fill in all required fields correctly.
      </div>

      <!-- Booking Form -->
      <form id="bookingForm">
        <!-- Personal Information Section -->
        <div class="section-title">Passenger Information</div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="passengerName" class="form-label">Full Name <span class="text-danger">*</span></label>
            <input type="text" class="form-control" id="passengerName" placeholder="Enter your full name" required>
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
            <input type="email" class="form-control" id="email" placeholder="example@email.com" required>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="phone" class="form-label">Phone Number <span class="text-danger">*</span></label>
            <input type="tel" class="form-control" id="phone" placeholder="10-digit mobile number" pattern="[0-9]{10}" required>
          </div>
          <div class="col-md-6">
            <label for="age" class="form-label">Age <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="age" placeholder="Enter age" min="1" max="120" required>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="gender" class="form-label">Gender <span class="text-danger">*</span></label>
            <select class="form-select" id="gender" required>
              <option value="">Select Gender</option>
              <option value="Male">Male</option>
              <option value="Female">Female</option>
              <option value="Other">Other</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="idProof" class="form-label">ID Proof Type <span class="text-danger">*</span></label>
            <select class="form-select" id="idProof" required>
              <option value="">Select ID Proof</option>
              <option value="Aadhar Card">Aadhar Card</option>
              <option value="PAN Card">PAN Card</option>
              <option value="Driving License">Driving License</option>
              <option value="Passport">Passport</option>
              <option value="Voter ID">Voter ID</option>
            </select>
          </div>
        </div>

        <!-- Journey Details Section -->
        <div class="section-title">Journey Details</div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="fromStation" class="form-label">From Station <span class="text-danger">*</span></label>
            <select class="form-select" id="fromStation" required>
              <option value="">Select Departure Station</option>
              <option value="Mumbai Central">Mumbai Central</option>
              <option value="New Delhi">New Delhi</option>
              <option value="Chennai Central">Chennai Central</option>
              <option value="Kolkata">Kolkata</option>
              <option value="Bangalore">Bangalore</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Pune">Pune</option>
              <option value="Ahmedabad">Ahmedabad</option>
              <option value="Jaipur">Jaipur</option>
              <option value="Lucknow">Lucknow</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="toStation" class="form-label">To Station <span class="text-danger">*</span></label>
            <select class="form-select" id="toStation" required>
              <option value="">Select Destination Station</option>
              <option value="Mumbai Central">Mumbai Central</option>
              <option value="New Delhi">New Delhi</option>
              <option value="Chennai Central">Chennai Central</option>
              <option value="Kolkata">Kolkata</option>
              <option value="Bangalore">Bangalore</option>
              <option value="Hyderabad">Hyderabad</option>
              <option value="Pune">Pune</option>
              <option value="Ahmedabad">Ahmedabad</option>
              <option value="Jaipur">Jaipur</option>
              <option value="Lucknow">Lucknow</option>
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="journeyDate" class="form-label">Date of Journey <span class="text-danger">*</span></label>
            <input type="date" class="form-control" id="journeyDate" required>
          </div>
          <div class="col-md-6">
            <label for="trainNumber" class="form-label">Train Number (Optional)</label>
            <input type="text" class="form-control" id="trainNumber" placeholder="e.g., 12345">
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <label for="numPassengers" class="form-label">Number of Passengers <span class="text-danger">*</span></label>
            <input type="number" class="form-control" id="numPassengers" placeholder="1-6 passengers" min="1" max="6" value="1" required>
          </div>
        </div>

        <!-- Class Selection -->
        <div class="section-title">Class & Preferences</div>

        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Travel Class <span class="text-danger">*</span></label>
            <div class="radio-group">
              <div class="row">
                <div class="col-md-3">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="travelClass" id="sleeper" value="Sleeper Class" checked>
                    <label class="form-check-label" for="sleeper">
                      Sleeper (SL)
                    </label>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="travelClass" id="ac3" value="AC 3 Tier">
                    <label class="form-check-label" for="ac3">
                      AC 3 Tier (3A)
                    </label>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="travelClass" id="ac2" value="AC 2 Tier">
                    <label class="form-check-label" for="ac2">
                      AC 2 Tier (2A)
                    </label>
                  </div>
                </div>
                <div class="col-md-3">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="travelClass" id="ac1" value="AC 1 Tier">
                    <label class="form-check-label" for="ac1">
                      AC 1 Tier (1A)
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-12">
            <label class="form-label">Berth Preference</label>
            <div class="radio-group">
              <div class="row">
                <div class="col-md-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="berthPreference" id="lower" value="Lower" checked>
                    <label class="form-check-label" for="lower">
                      Lower
                    </label>
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="berthPreference" id="middle" value="Middle">
                    <label class="form-check-label" for="middle">
                      Middle
                    </label>
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="berthPreference" id="upper" value="Upper">
                    <label class="form-check-label" for="upper">
                      Upper
                    </label>
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="berthPreference" id="sideLower" value="Side Lower">
                    <label class="form-check-label" for="sideLower">
                      Side Lower
                    </label>
                  </div>
                </div>
                <div class="col-md-2">
                  <div class="form-check">
                    <input class="form-check-input" type="radio" name="berthPreference" id="sideUpper" value="Side Upper">
                    <label class="form-check-label" for="sideUpper">
                      Side Upper
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Additional Services -->
        <div class="row mb-4">
          <div class="col-md-12">
            <label class="form-label">Additional Services</label>
            <div class="radio-group">
              <div class="row">
                <div class="col-md-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="mealPreference" value="Meal">
                    <label class="form-check-label" for="mealPreference">
                      Meal Preference
                    </label>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="insurance" value="Insurance">
                    <label class="form-check-label" for="insurance">
                      Travel Insurance
                    </label>
                  </div>
                </div>
                <div class="col-md-4">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="sms" value="SMS">
                    <label class="form-check-label" for="sms">
                      SMS Alerts
                    </label>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Special Requests -->
        <div class="mb-4">
          <label for="specialRequests" class="form-label">Special Requests</label>
          <textarea class="form-control" id="specialRequests" rows="3" placeholder="Enter any special requirements or requests"></textarea>
        </div>

        <!-- Terms and Conditions -->
        <div class="mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" id="terms" required>
            <label class="form-check-label" for="terms">
              I agree to the <strong>Terms and Conditions</strong> and <strong>Privacy Policy</strong> <span class="text-danger">*</span>
            </label>
          </div>
        </div>

        <!-- Submit Buttons -->
        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
          <button type="submit" class="btn btn-primary btn-book">Book Ticket</button>
          <button type="reset" class="btn btn-secondary btn-reset">Reset Form</button>
        </div>
      </form>
    </div>

    <!-- Footer Info -->
    <div class="text-center text-muted">
      <small>&copy; 2026 Train Booking System. All rights reserved.</small>
    </div>
  </div>

  <!-- Bootstrap JS and jQuery -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    $(document).ready(function() {
      // Set minimum date to today
      var today = new Date().toISOString().split('T')[0];
      $('#journeyDate').attr('min', today);

      // Form submission handler
      $('#bookingForm').on('submit', function(e) {
        e.preventDefault();

        // Hide previous alerts
        $('#successAlert, #errorAlert').hide();

        // Validate form
        if (this.checkValidity() === false) {
          e.stopPropagation();
          $('#errorAlert').fadeIn();
          $(this).addClass('was-validated');
          return false;
        }

        // Check if from and to stations are different
        if ($('#fromStation').val() === $('#toStation').val()) {
          alert('Departure and destination stations cannot be the same!');
          return false;
        }

        // Collect form data
        var formData = {
          name: $('#passengerName').val(),
          email: $('#email').val(),
          phone: $('#phone').val(),
          age: $('#age').val(),
          gender: $('#gender').val(),
          idProof: $('#idProof').val(),
          from: $('#fromStation').val(),
          to: $('#toStation').val(),
          date: $('#journeyDate').val(),
          trainNumber: $('#trainNumber').val() || 'Not specified',
          numPassengers: $('#numPassengers').val(),
          travelClass: $('input[name="travelClass"]:checked').val(),
          berthPreference: $('input[name="berthPreference"]:checked').val(),
          specialRequests: $('#specialRequests').val() || 'None'
        };

        // Collect additional services
        var services = [];
        if ($('#mealPreference').is(':checked')) services.push('Meal');
        if ($('#insurance').is(':checked')) services.push('Insurance');
        if ($('#sms').is(':checked')) services.push('SMS Alerts');
        formData.services = services.length > 0 ? services.join(', ') : 'None';

        // Display booking details
        var bookingDetails = `
          <strong>Booking Summary:</strong><br>
          Passenger: ${formData.name} | ${formData.age} years | ${formData.gender}<br>
          Journey: ${formData.from} → ${formData.to} on ${formatDate(formData.date)}<br>
          Class: ${formData.travelClass} | Berth: ${formData.berthPreference}<br>
          Passengers: ${formData.numPassengers} | Additional Services: ${formData.services}
        `;

        $('#bookingDetails').html(bookingDetails);
        $('#successAlert').fadeIn();

        // Scroll to top to show success message
        $('html, body').animate({ scrollTop: 0 }, 'slow');

        // Log to console (simulating server submission)
        console.log('Booking Details:', formData);
      });

      // Reset form handler
      $('#bookingForm').on('reset', function() {
        $('#successAlert, #errorAlert').hide();
        $(this).removeClass('was-validated');
        setTimeout(function() {
          $('#sleeper').prop('checked', true);
          $('#lower').prop('checked', true);
        }, 0);
      });

      // Format date function
      function formatDate(dateString) {
        var date = new Date(dateString);
        var options = { year: 'numeric', month: 'long', day: 'numeric' };
        return date.toLocaleDateString('en-US', options);
      }

      // Real-time validation feedback
      $('.form-control, .form-select').on('blur', function() {
        if ($(this).is(':invalid')) {
          $(this).addClass('is-invalid');
        } else {
          $(this).removeClass('is-invalid').addClass('is-valid');
        }
      });

      // Phone number validation
      $('#phone').on('input', function() {
        var phone = $(this).val();
        if (phone.length === 10 && /^[0-9]{10}$/.test(phone)) {
          $(this).removeClass('is-invalid').addClass('is-valid');
        } else if (phone.length > 0) {
          $(this).removeClass('is-valid').addClass('is-invalid');
        }
      });

      // Email validation
      $('#email').on('blur', function() {
        var email = $(this).val();
        var emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (emailRegex.test(email)) {
          $(this).removeClass('is-invalid').addClass('is-valid');
        } else if (email.length > 0) {
          $(this).removeClass('is-valid').addClass('is-invalid');
        }
      });

      // Dynamic passenger count display
      $('#numPassengers').on('change', function() {
        var count = $(this).val();
        console.log('Number of passengers selected: ' + count);
      });
    });
  </script>
</body>
</html>
