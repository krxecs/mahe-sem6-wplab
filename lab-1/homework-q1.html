<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Population Table</title>

  <style>
    body{
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      padding-top: 50px;
    }

    table{
      border-collapse: collapse;
      border: 2px solid #333;
      width: 550px;
      text-align: center;
    }

    th, td{
      border: 2px solid #333;
      padding: 10px;
      font-size: 18px;
      font-weight: bold;
    }

    th{
      background: red;
      color: black;
      font-size: 20px;
    }

    .country{
      background: #f8de99;
      width: 150px;
      font-size: 22px;
      letter-spacing: 1px;
    }

    .year{
      background: #95a9e5;
      width: 200px;
    }

    .pop{
      background: #a8cf8b;
      width: 200px;
    }
  </style>
</head>

<body>
  <table>
    <tr>
      <th>Country</th>
      <th colspan="2">Population (in Crores)</th>
    </tr>

    <tr>
      <td class="country" rowspan="3">INDIA</td>
      <td class="year">1998</td>
      <td class="pop">85</td>
    </tr>
    <tr>
      <td class="year">1999</td>
      <td class="pop">90</td>
    </tr>
    <tr>
      <td class="year">2000</td>
      <td class="pop">100</td>
    </tr>

    <tr>
      <td class="country" rowspan="3">USA</td>
      <td class="year">1998</td>
      <td class="pop">30</td>
    </tr>
    <tr>
      <td class="year">1999</td>
      <td class="pop">35</td>
    </tr>
    <tr>
      <td class="year">2000</td>
      <td class="pop">40</td>
    </tr>

    <tr>
      <td class="country" rowspan="3">UK</td>
      <td class="year">1998</td>
      <td class="pop">25</td>
    </tr>
    <tr>
      <td class="year">1999</td>
      <td class="pop">30</td>
    </tr>
    <tr>
      <td class="year">2000</td>
      <td class="pop">35</td>
    </tr>
  </table>
</body>
</html>
